<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Перевірка усного рахунку</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<script language="JavaScript">
    var max_value, operand1 = 0, operand2 = 0, result = 0;
    var flag = 0; 
    var sign = "+";
    var input = "";

    function set_sign(x) {
        if (x == "+") { flag = 0; sign = "+"; }
        if (x == "-") { flag = 1; sign = "-"; }
        if (x == "*") { flag = 2; sign = "*"; }
        return true;
    }

    function f_operand() {
        operand1 = Math.floor(Math.random() * max_value);
        return parseInt(operand1);
    }

    function s_operand() {
        if (flag == 0) {
            operand2 = Math.floor(Math.random() * (max_value - operand1));
        } else if (flag == 1) {
            operand2 = Math.floor(Math.random() * operand1);
        } else if (flag == 2) {
            operand2 = Math.floor(Math.random() * (max_value / 2)) + 1;
        }
        return parseInt(operand2);
    }

    function input_sign(x) {
        if (x == 10) {
            var correct = false;
            if (flag == 0 && (operand1 + operand2 == parseInt(input))) correct = true;
            if (flag == 1 && (operand1 - operand2 == parseInt(input))) correct = true;
            if (flag == 2 && (operand1 * operand2 == parseInt(input))) correct = true;

            window.document.forms["test"].r0.value = correct ? "Вірно!" : "Спробуй ще!";
            if (!correct) input = "";
            return true;
        }
        input += x;
        window.document.forms["test"].result.value = input;
        return true;
    }

    function main_calc() {
        operand1 = f_operand();
        window.document.forms["test"]["op1"].value = operand1;
        operand2 = s_operand();
        window.document.forms["test"]["op2"].value = operand2;
        window.document.forms["test"]["s_sign"].value = sign;
        input = "";
        window.document.forms['test'].result.value = "";
        window.document.forms["test"]["r0"].value = "???";
        return true;
    }
</script>

<body>
    <h1 class="center">Математичний тест</h1>
    <hr />
    <form name="test">
        <table class="center">
            <tr>
                <td><input class="range-btn" type=button value="0-10" onClick="max_value=10"></td>
                <td><input class="range-btn" type=button value="0-20" onClick="max_value=20"></td>
                <td><input class="range-btn" type=button value="20-38" onClick="max_value=38"></td>
                <td><input class="range-btn" type=button value="0-100" onClick="max_value=100"></td>
                <td><input class="sign-btn" type=button value="+" onClick='set_sign("+")'></td>
                <td><input class="sign-btn" type=button value="-" onClick='set_sign("-")'></td>
                <td><input class="sign-btn" type=button value="*" onClick='set_sign("*")'></td>
            </tr>
        </table>
        <hr />
        <table class="center">
            <tr>
                <td><input id="op1" size="3" maxlength="3"></td>
                <td><input id="s_sign" size="1" maxlength="1"></td>
                <td><input id="op2" size="3" maxlength="3"></td>
                <td>=</td>
                <td><input id="result" size="4" maxlength="4"></td>
                <td><input id="award" type=button value="?" onClick="main_calc()"></td>
                <td><input id="r0" value="???"></td>
            </tr>
        </table>
        <hr />
        <table id="keyboard">
            <tr>
                <td><input class="num1-btn" type=button value="1" onClick='input_sign("1")'></td>
                <td><input class="num2-btn" type=button value="2" onClick='input_sign("2")'></td>
                <td><input class="num3-btn" type=button value="3" onClick='input_sign("3")'></td>
            </tr>
            <tr>
                <td><input class="num4-btn" type=button value="4" onClick='input_sign("4")'></td>
                <td><input class="num5-btn" type=button value="5" onClick='input_sign("5")'></td>
                <td><input class="num6-btn" type=button value="6" onClick='input_sign("6")'></td>
            </tr>
            <tr>
                <td><input class="num7-btn" type=button value="7" onClick='input_sign("7")'></td>
                <td><input class="num8-btn" type=button value="8" onClick='input_sign("8")'></td>
                <td><input class="num9-btn" type=button value="9" onClick='input_sign("9")'></td>
            </tr>
            <tr>
                <td><input class="num0-btn" type=button value="0" onClick='input_sign("0")'></td>
                <td colspan="2"><input class="ok-btn" type="button" value="OK" onClick='input_sign("10")'></td>
            </tr>
        </table>
    </form>
    <hr />
</body>

</html>
